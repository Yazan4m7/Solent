<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign In</title>
<style>
  /* Reset */
  * {
    box-sizing: border-box;
  }
  body, html {
    margin: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
    background-size: cover;
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    max-width: 1100px;
    width: 100%;
    display: flex;
    gap: 120px;
    align-items: center;
    justify-content: center;
  }

  .left-section {
    flex: 1;
    color: white;
    text-shadow: 0 0 6px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .left-section .logo {
    display: flex;
    align-items: center;
    font-weight: 700;
    font-size: 36px;
    gap: 14px;
    margin-bottom: 12px;
  }
  .left-section .logo svg {
    width: 48px;
    height: 48px;
    fill: white;
  }
  .left-section p {
    font-size: 16px;
    max-width: 280px;
    line-height: 1.4;
  }

  .right-section {
    flex: 0 0 400px;
    background: white;
    padding: 48px 45px 48px 45px;
    border-radius: 8px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.24);
  }

  .right-section h1 {
    margin-top: 0;
    font-size: 30px;
    font-weight: 700;
    color: #111;
    margin-bottom: 12px;
  }

  .new-user {
    font-size: 14px;
    margin-bottom: 28px;
    color: #444;
  }
  .new-user a {
    color: #0066ff;
    text-decoration: none;
  }
  .new-user a:hover {
    text-decoration: underline;
  }

  label {
    display: block;
    font-size: 14px;
    margin-bottom: 6px;
    font-weight: 600;
    color: #333;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    height: 40px;
    padding: 8px 12px;
    font-size: 16px;
    border: 1.3px solid #b3b3b3;
    border-radius: 5px;
    outline-offset: 2px;
    transition: border-color 0.2s ease-in-out;
  }
  input[type="text"]:focus,
  input[type="password"]:focus {
    border-color: #0066ff;
    box-shadow: 0 0 4px rgba(0, 102, 255, 0.4);
  }

  .remember-me {
    display: flex;
    align-items: center;
    margin: 22px 0 30px 0;
    font-weight: 500;
    font-size: 14px;
    color: #333;
  }
  .remember-me input {
    margin-right: 10px;
    width: 18px;
    height: 18px;
    cursor: pointer;
  }
  .remember-me label {
    cursor: pointer;
  }

  button.signin-btn {
    width: 100%;
    background-color: #0066ff;
    color: white;
    border: none;
    padding: 12px 0;
    font-weight: 600;
    font-size: 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  button.signin-btn:hover {
    background-color: #004bb5;
  }

  .links {
    margin-top: 26px;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
  }
  .links a {
    color: #0066ff;
    text-decoration: none;
  }
  .links a:hover {
    text-decoration: underline;
  }

  /* Responsive tweaks */
  @media (max-width: 800px) {
    .container {
      flex-direction: column;
      gap: 40px;
      max-width: 90vw;
    }
    .left-section {
      align-items: center;
      text-align: center;
    }
  }
</style>
</head>
<body>
  <div class="container" role="main">
    <div class="left-section" aria-label="Adobe Branding and information">
      <div class="logo" aria-label="Adobe logo">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
          <rect width="24" height="24" fill="#FF0000"/>
          <path d="M4.5 20L14 4h3L7 20z" fill="#fff"/>
        </svg>
        Adobe
      </div>
      <p>Sign in or create an account</p>
    </div>

    <section class="right-section" aria-label="Sign in form">
      <h1>Sign in</h1>
      <div class="new-user">
        New user? <a href="#" tabindex="0">Create an account</a>
      </div>

      <form action="#" method="POST" novalidate>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username" />

        <label for="password" style="margin-top: 18px;">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password" />
        
        <div class="remember-me">
          <input type="checkbox" id="remember" name="remember" />
          <label for="remember">Remember me</label>
        </div>

        <button type="submit" class="signin-btn" aria-label="Sign in">Sign in</button>
      </form>

      <div class="links">
        <a href="#">More sign-in options</a>
        <a href="#">Get help signing in</a>
      </div>
    </section>
  </div>
</body>
</html>
