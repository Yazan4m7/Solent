<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solent - دليل عرض النظام</title>
    <style>
        @font-face {
            font-family: "Cairo";
            src: url("assets/Cairo-VariableFont.ttf") format("truetype");
            font-style: normal;
            font-weight: 200 1000;
            font-display: swap;
        }

        :root {
            --ink: #0f172a;
            --muted: #5f687c;
            --accent: #5852ee;
            --accent-dark: #4338ca;
            --accent-soft: #f1f0ff;
            --panel: #f6f7fb;
            --line: #dfe3ed;
            --teal: #159a92;
            --teal-soft: #e9f8f6;
            --orange: #e77918;
            --orange-soft: #fff4e6;
            --orange-line: #f5c785;
            --red: #d84a3c;
            --red-soft: #fff0ed;
            --green: #087a53;
            --green-soft: #eaf8f1;
            --paper: #ffffff;
            --canvas: #e9edf4;
        }

        * { box-sizing: border-box; }

        html { background: var(--canvas); }

        body {
            margin: 0;
            color: var(--ink);
            background: var(--canvas);
            font-family: "Cairo", sans-serif;
            line-height: 1.48;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .page {
            width: 210mm;
            height: 297mm;
            margin: 12mm auto;
            padding: 8mm 10mm 7mm;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--paper);
            box-shadow: 0 14px 38px rgba(15, 23, 42, 0.13);
            break-after: page;
            page-break-after: always;
        }

        .page:last-child {
            break-after: auto;
            page-break-after: auto;
        }

        .header {
            min-height: 10mm;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            direction: ltr;
        }

        .brand-logo {
            width: 29mm;
            height: 8.5mm;
            object-fit: contain;
            object-position: left center;
        }

        .page-meta {
            display: grid;
            gap: 1px;
            color: #687087;
            direction: ltr;
            text-align: right;
            font-size: 7.5px;
            font-weight: 700;
            letter-spacing: 1.25px;
        }

        .page-meta strong {
            color: var(--accent);
            font-size: 9px;
            letter-spacing: 1.6px;
        }

        .intro { padding: 2.5mm 0 3mm; }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 2.5mm;
            margin-bottom: 1.7mm;
            color: var(--accent-dark);
            font-size: 8px;
            font-weight: 800;
        }

        .eyebrow-number {
            min-width: 8mm;
            height: 6.6mm;
            display: grid;
            place-items: center;
            direction: ltr;
            color: var(--accent);
            background: #fff;
            border: 1px solid #9c99ff;
            border-radius: 1.5mm;
            font-size: 8px;
        }

        .eyebrow-label {
            padding: 1mm 2.4mm;
            background: var(--accent-soft);
            border-radius: 999px;
        }

        h1 {
            margin: 0;
            color: var(--ink);
            font-size: 23px;
            line-height: 1.25;
            font-weight: 850;
            letter-spacing: -0.25px;
        }

        .lead {
            max-width: 180mm;
            margin: 1.4mm 0 0;
            color: var(--muted);
            font-size: 10.3px;
            font-weight: 500;
        }

        .context-card {
            position: relative;
            margin-bottom: 3mm;
            padding: 3.6mm 4.2mm;
            color: #fff;
            background: var(--ink);
            border-radius: 3mm;
            border-right: 2.2mm solid var(--teal);
        }

        .context-card strong {
            display: block;
            margin-bottom: 0.8mm;
            color: #f4b629;
            font-size: 10.4px;
            font-weight: 800;
        }

        .context-card p {
            margin: 0;
            color: #eef2ff;
            font-size: 8.8px;
            line-height: 1.65;
        }

        .screen-frame,
        .workflow-frame {margin: 5vh 0;position: relative;overflow: hidden;width: 100%;display: grid;place-items: center;background: var(--panel);border: 1px solid var(--line);border-radius: 3mm;justify-content: end;grid-auto-flow: row;}

        .screen-frame {height: 71mm;}
        .workflow-frame { height: 76mm; padding: 2.5mm; background: #fbfbfe; }

        .shot-image {
            position: absolute;
            inset: 0;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: none;
            object-fit: contain;
            background: #fff;
        }

        .screen-frame.has-image .shot-image { display: block; }
        .screen-frame.has-image .shot-placeholder { display: none; }

        .shot-placeholder {
            display: grid;
            justify-items: center;
            gap: 1mm;
            color: #687087;
            text-align: center;
        }

        .ghost-logo {
            width: 11mm;
            height: 11mm;
            margin-bottom: 0.5mm;
            object-fit: contain;
            opacity: 0.18;
            filter: grayscale(1);
        }

        .shot-placeholder strong {
            color: #3c455d;
            font-size: 10px;
            font-weight: 750;
        }

        .shot-placeholder small {
            color: var(--accent);
            direction: ltr;
            font-size: 7.4px;
            font-weight: 700;
            letter-spacing: 0.45px;
        }

        .figure-caption {
            min-height: 6.3mm;
            display: flex;
            align-items: center;
            gap: 2.5mm;
            padding-top: 1mm;
            color: #697188;
            direction: ltr;
            font-size: 7.8px;
        }

        .figure-caption strong {
            flex: 0 0 auto;
            color: var(--accent);
            font-size: 7.5px;
            letter-spacing: 0.7px;
        }

        .figure-caption span { direction: rtl; }

        .section-title {
            display: flex;
            align-items: center;
            gap: 2.5mm;
            margin: 7.2mm 0 1.7mm;
            color: var(--ink);
            font-size: 10px;
            font-weight: 800;
        }

        .section-title::before {
            content: "";
            width: 10mm;
            height: 1px;
            background: #cdd2df;
        }

        .section-title small {
            color: var(--accent);
            direction: ltr;
            font-size: 6.7px;
            font-weight: 800;
            letter-spacing: 0.8px;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2mm 2.8mm;
        }

        .feature-box {
            position: relative;
            min-height: 17.5mm;
            padding: 2.7mm 10.5mm 2.4mm 3mm;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 2.7mm;
        }

        .feature-index {
            position: absolute;
            top: 2.7mm;
            right: 2.7mm;
            width: 6mm;
            height: 6mm;
            display: grid;
            place-items: center;
            color: var(--accent);
            background: var(--accent-soft);
            border: 1px solid #c9c7ff;
            border-radius: 1.4mm;
            direction: ltr;
            font-size: 9.7px;
            font-weight: 850;
        }

        .feature-box h2 {
            margin: 0 0 0.6mm;
            color: var(--ink);
            font-size: 10.2px;
            line-height: 1.3;
            font-weight: 800;
        }

        .feature-box p {
            margin: 0;
            color: var(--muted);
            font-size: 7.7px;
            line-height: 1.48;
        }

        .feature-box.emphasis {
            background: #f8f8ff;
            border: 1.5px solid var(--accent);
        }

        .feature-box.emphasis h2 {
            color: var(--accent-dark);
            font-size: 11px;
        }

        .feature-box.secondary {
            background: var(--orange-soft);
            border-color: #adadad;
        }

        .feature-box.secondary .feature-index {
            color: var(--orange);
            background: #fff;
            border-color: var(--orange-line);
        }

        .feature-box.secondary::after {
            content: "إضافي";
            position: absolute;
            top: 2.6mm;
            left: 3mm;
            color: var(--orange);
            font-size: 6px;
            font-weight: 850;
        }

        .comparison {
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 2.7mm;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
        }

        .comparison th {
            padding: 2.1mm 2.6mm;
            color: #fff;
            background: var(--ink);
            text-align: right;
            font-size: 7.3px;
            font-weight: 800;
        }

        .comparison th:first-child { width: 23%; }

        .comparison td {
            padding: 1.9mm 2.6mm;
            vertical-align: middle;
            border-top: 1px solid var(--line);
            font-size: 7.6px;
            line-height: 1.35;
        }

        .comparison tbody tr:first-child td { border-top: 0; }
        .comparison td:first-child { color: var(--ink); background: #fff; font-weight: 750; }
        .comparison td.manual { color: var(--red); background: var(--red-soft); }
        .comparison td.solent { color: var(--green); background: var(--green-soft); font-weight: 650; }

        .class-band {
            margin-bottom: 5vh;
            padding: 3.2mm;
            color: #fff;
            background: linear-gradient(135deg, #5852ee, #655ff3);
            border-radius: 3mm;
        }

        .class-band-label {
            margin-bottom: 2.2mm;
            color: #dddfff;
            direction: ltr;
            text-align: left;
            font-size: 6.8px;
            font-weight: 800;
            letter-spacing: 0.7px;
        }

        .class-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 4.2mm;
            direction: ltr;
        }

        .class-item {
            min-height: 15mm;
            display: grid;
            font-size: 1px;
            place-items: center;
            gap: 0;
            padding: 1.4mm;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.32);
            border-radius: 2.2mm;
            /* margin-bottom: 5vh; */
        }

        .class-item strong {font-size: 15px;line-height: 1;}
        .class-item span {font-size: 16.4px;font-weight: 750;}

        .reason-panel {
            margin-top: 2.2mm;
            padding: 2.2mm 2.8mm;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 2.7mm;
        }

        .reason-panel strong {
            display: block;
            margin-bottom: 1.5mm;
            color: var(--ink);
            font-size: 7.8px;
        }

        .reason-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 1.3mm;
        }

        .reason-chip {
            padding: 0.8mm 2.2mm;
            color: #ad560f;
            background: var(--orange-soft);
            border-radius: 999px;
            font-size: 6.8px;
            font-weight: 700;
        }

        .process-strip,
        .portal-strip,
        .platform-strip {
            display: grid;
            gap: 2mm;
            margin-top: 2.2mm;
        }

        .process-strip { grid-template-columns: repeat(4, minmax(0, 1fr)); direction: rtl; }
        .portal-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .platform-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }

        .process-step,
        .portal-item,
        .platform-item {
            min-height: 15mm;
            display: grid;
            align-content: center;
            gap: 0.5mm;
            padding: 2mm 2.5mm;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 2.4mm;
        }

        .process-step strong,
        .portal-item strong,
        .platform-item strong { color: var(--ink); font-size: 8px; }
        .process-step span,
        .portal-item span,
        .platform-item span { color: var(--muted); font-size: 6.8px; line-height: 1.4; }

        .portal-item:last-child,
        .platform-item:last-child {
            background: var(--orange-soft);
            border-color: var(--orange-line);
        }

        .route-table {
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 2.7mm;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
        }

        .route-table th {
            padding: 1.8mm 2.5mm;
            color: #fff;
            background: var(--ink);
            text-align: right;
            font-size: 7px;
        }

        .route-table th:first-child { width: 23%; }
        .route-table th:last-child { width: 18%; }

        .route-table td {
            padding: 1.6mm 2.5mm;
            color: #485168;
            background: #fff;
            border-top: 1px solid var(--line);
            font-size: 7px;
            line-height: 1.35;
        }

        .route-table tbody tr:nth-child(even) td { background: #f8fafc; }

        .route-flow {
            color: var(--teal);
            direction: ltr;
            text-align: left;
            font-size: 6.8px;
            font-weight: 800;
        }

        .page-workflow .route-table td:first-child,
        .page-workflow .route-table td:last-child {
            direction: ltr;
            text-align: left;
        }

        .permission-table th:first-child { width: 21%; }
        .permission-table td { text-align: center; }
        .permission-table td:first-child { text-align: right; font-weight: 750; }
        .permission-yes { color: var(--green); background: var(--green-soft) !important; font-weight: 800; }
        .permission-scope { color: var(--accent-dark); background: var(--accent-soft) !important; font-weight: 750; }
        .permission-no { color: #9aa1b2; }

        .answer-table th:first-child { width: 23%; }
        .answer-table th:nth-child(2) { width: 28%; }
        .answer-table td:last-child {
            color: var(--green);
            background: var(--green-soft);
            font-weight: 700;
        }

        .demo-cue {
            min-height: 9mm;
            display: flex;
            align-items: center;
            gap: 2.5mm;
            margin-top: 2.3mm;
            padding: 1.8mm 2.6mm;
            color: #384158;
            background: #fafafe;
            border: 1px solid var(--line);
            border-radius: 2.3mm;
            font-size: 7.7px;
            font-weight: 650;
        }

        .demo-cue strong {
            flex: 0 0 auto;
            color: var(--accent);
            font-size: 7.2px;
        }

        .footer {
            min-height: 7mm;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 2mm;
            color: #8a92a5;
            direction: ltr;
            border-top: 1px solid #eceef4;
            font-size: 6.9px;
        }

        .footer strong { color: #4e576d; font-weight: 800; }

        .workflow { width: 100%; height: 100%; direction: ltr; }
        .workflow .link { fill: none; stroke: #b8bfd2; stroke-width: 3; marker-end: url(#workflow-arrow); }
        .workflow .junction { fill: #b8bfd2; }
        .workflow .stage { fill: #fff; stroke: #d8ddea; stroke-width: 2; }
        .workflow .stage.branch { fill: var(--teal-soft); stroke: var(--teal); }
        .workflow .stage.active { fill: var(--accent); stroke: var(--accent); }
        .workflow .stage-no { fill: var(--accent); font-family: "Cairo", sans-serif; font-size: 13px; font-weight: 850; text-anchor: middle; }
        .workflow .stage.branch + .stage-no { fill: var(--teal); }
        .workflow .stage-name { fill: var(--ink); font-family: "Cairo", sans-serif; font-size: 16px; font-weight: 780; text-anchor: middle; direction: ltr; unicode-bidi: normal; }
        .workflow .active-text { fill: #fff; }

        .page-workflow .feature-box { min-height: 19.5mm; }
        .page-quality .screen-frame {height: 42mm;}
        .page-quality .intro { padding-bottom: 2.4mm; }
        .page-finance .screen-frame {height: 103mm;}
        .page-settings .feature-box { min-height: 21mm; }


        .screen-frame--page-02{
        height: 77mm !important;
        }




        .screen-frame--page-07{
        height: 77mm !important;
        }










        @page { size: A4 portrait; margin: 0; }

        @media print {
            html, body { background: #fff; }
            .page { margin: 0; box-shadow: none; }
        }

        @media screen and (max-width: 850px) {
            .page {
                width: 100%;
                height: auto;
                min-height: 100vh;
                margin: 0 0 18px;
                padding: 24px 18px;
            }

            .feature-grid,
            .class-grid,
            .process-strip,
            .portal-strip,
            .platform-strip { grid-template-columns: 1fr; }

            .screen-frame,
            .workflow-frame { height: auto; min-height: 280px; }
            .comparison,
            .route-table { display: block; overflow-x: auto; }
        }
    </style>
</head>

            section.className = 'page ' + (page.className || '');
            section.innerHTML = '<header class="header"><img class="brand-logo" src="assets/solent-horizontal.svg" alt="Solent"><div class="page-meta"><span>SYSTEM WALKTHROUGH</span><strong>' + page.number + ' / 08</strong></div></header><div class="intro"><div class="eyebrow"><span class="eyebrow-number">' + page.number + '</span><span class="eyebrow-label">' + esc(page.category) + '</span></div><h1>' + esc(page.title) + '</h1><p class="lead">' + esc(page.lead) + '</p></div>' + renderBody(page) + esc(page.cue) + '</span></div><footer class="footer"><strong>Solent</strong><span>' + esc(page.category) + '</span><span>' + page.number + ' / 08</span></footer>';
            var screenshot = section.querySelector('.shot-image');
            if (screenshot) {
                screenshot.addEventListener('load', function () { screenshot.parentElement.classList.add('has-image'); });
                screenshot.addEventListener('error', function () { screenshot.style.display = 'none'; });
                if (screenshot.complete && screenshot.naturalWidth > 0) { screenshot.parentElement.classList.add('has-image'); }
            }
            return section;
        }

        var handout = document.getElementById('handout');
        pages.forEach(function (page) { handout.appendChild(renderPage(page)); });
    </script>
</body>
</html>
